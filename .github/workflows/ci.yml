name: GitHub Actions pipeline for AWS SageMaker AI demo
on:
  push:
    branches:
    - main
jobs:
  opentofu:
    runs-on: ubuntu-latest
    steps:
    - name: OpenTofu - Setup Tofu
      uses: opentofu/setup-opentofu@v1
      with:
        tofu_version: ^1.13.9
    - name: Checkout
      uses: actions/checkout@v3
    - name: Initialize OpenTofu without backend
      run: |
        tofu -chdir=infra/ init -backend=false
    - name: Check OpenTofu formatting
      run: |
        tofu -chdir=infra/ fmt -recursive -check
    - name: Validate OpenTofu configuration
      run: |
        tofu -chdir=infra/ validate
